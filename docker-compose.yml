# Préproduction et production sur le VPS de l'IAMA (voir docs/DEPLOIEMENT.md).
# Développement local : seule la base est utile → docker compose up -d db
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: iama
      POSTGRES_USER: iama
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?définir POSTGRES_PASSWORD dans .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - '127.0.0.1:5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U iama']
      interval: 10s
      retries: 5

  web:
    build:
      context: .
      network: host
      args:
        DATABASE_URL: postgres://iama:${POSTGRES_PASSWORD}@127.0.0.1:5432/iama
        PAYLOAD_SECRET: ${PAYLOAD_SECRET}
        NEXT_PUBLIC_SERVER_URL: ${NEXT_PUBLIC_SERVER_URL}
        SITE_ENV: ${SITE_ENV:-preprod}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgres://iama:${POSTGRES_PASSWORD}@db:5432/iama
    volumes:
      - media:/app/media
    ports:
      # Exposé uniquement en local : Nginx assure le HTTPS devant.
      - '127.0.0.1:3000:3000'

volumes:
  pgdata:
  media:
