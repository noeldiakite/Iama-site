# Nginx devant le site IAMA. Copier dans /etc/nginx/sites-available/ puis activer.
# Certificat : sudo certbot --nginx -d www.iama.aero -d iama.aero   (préprod : -d test.iama.aero)

# Limite les envois de formulaires et les tentatives de connexion (F9)
limit_req_zone $binary_remote_addr zone=iama_post:10m rate=10r/m;

server {
    listen 80;
    server_name iama.aero www.iama.aero;
    return 301 https://www.iama.aero$request_uri;
}

server {
    listen 443 ssl http2;
    server_name www.iama.aero;
    # Lignes ssl_certificate ajoutées par certbot

    client_max_body_size 25m;   # téléversement des brochures PDF et images

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        expires 365d;
        add_header Cache-Control "public, immutable";
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location = /api/users/login {
        limit_req zone=iama_post burst=5 nodelay;
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
